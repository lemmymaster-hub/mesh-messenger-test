name: NRN validation
on:
  push:
    branches: [main, 'codex/**']
concurrency:
  group: nrn-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NRN-UI-review
          path: test-output/
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: NRN-Mesh-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
